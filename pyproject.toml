[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-grok-plugin"
version = "0.1.0"
authors = [
  { name="avocadori" },
]
description = "High-performance Discord auto-responder plugin with short-term memory for Grok build style continuity. Complete, distributable plugin for others to use."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "discord.py>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
discord-grok-plugin = "discord_grok_plugin.main:run_bot"

[tool.setuptools.packages.find]
where = ["src"]
